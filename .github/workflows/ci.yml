name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # 仅供模块导入使用，不是真实数据库凭证。
      MYSQL_USER: ci_unused
      MYSQL_PASSWORD: ci_unused
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: rag_platform
      JWT_SECRET_KEY: ci-only-placeholder-not-for-production-123456
      OPENAI_API_KEY: ci-unused-placeholder
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r requirements.txt "httpx==0.28.1"

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Run isolated backend tests
        run: |
          python -m unittest discover -s tests -p "test_document_loader.py" -v
          python -m unittest discover -s tests -p "test_documents.py" -v
          python -m unittest discover -s tests -p "test_kb_index.py" -v
          python -m unittest discover -s tests -p "test_knowledge_*.py" -v
          python -m unittest discover -s tests -p "test_retrieval.py" -v
          python -m unittest discover -s tests -p "test_stream_response.py" -v
          python -m unittest discover -s tests -p "test_history.py" -v
          python -m unittest discover -s tests -p "test_legacy_disabled.py" -v

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint active frontend files
        run: npx --no-install eslint src/AccountApp.jsx src/DocumentPanel.jsx src/api.js src/main.jsx vite.config.js

      - name: Build frontend
        run: npm run build