name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # 仅供模块导入使用，不是真实数据库凭证。
      MYSQL_USER: ci_unused
      MYSQL_PASSWORD: ci_unused
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: rag_platform
      JWT_SECRET_KEY: ci-only-placeholder-not-for-production-123456
      OPENAI_API_KEY: ci-unused-placeholder
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r requirements-dev.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Run isolated backend tests
        run: python tests/run_unit.py

  mysql:
    name: MySQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: rag_platform
          MYSQL_USER: ci_runner
          MYSQL_PASSWORD: ci_test_only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: ci_runner
      MYSQL_PASSWORD: ci_test_only
      MYSQL_DATABASE: rag_platform
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install migration dependencies
        run: python -m pip install "SQLAlchemy==2.0.52" "PyMySQL[rsa]==1.2.3" "alembic==1.20.0" "python-dotenv==1.2.2"
      - name: Upgrade empty database and check model consistency
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Verify JSON and foreign key behavior on MySQL
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
        run: python tests/verify_mysql.py

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint active frontend files
        run: npm run lint

      - name: Test frontend API helpers
        run: npm test

      - name: Build frontend
        run: npm run build
