name: campus-rag

services:
  backend:
    build: .
    env_file: .env
    environment:
      MYSQL_HOST: ${DOCKER_MYSQL_HOST:-host.docker.internal}
      HF_HOME: /app/cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${APP_PORT:-8003}:8002"
    volumes:
      - ./data:/app/data
      - ./outputs/huggingface:/app/cache/huggingface
      - ./outputs/docker-tmp:/tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
